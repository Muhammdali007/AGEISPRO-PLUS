services:
  postgres:
    image: postgres:16-alpine
    container_name: aegispro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegispro}
      POSTGRES_USER: ${POSTGRES_USER:-aegispro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegispro} -d ${POSTGRES_DB:-aegispro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegispro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
    container_name: aegispro-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    profiles:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: aegispro-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    profiles:
      - web

volumes:
  postgres_data:
  redis_data:

