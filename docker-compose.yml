services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegispro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegispro}
      POSTGRES_USER: ${POSTGRES_USER:-aegispro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegispro} -d ${POSTGRES_DB:-aegispro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegispro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: aegispro-api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SERVICE_CALLBACK_TOKEN: ${SERVICE_CALLBACK_TOKEN}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      STORAGE_ROOT: ${STORAGE_ROOT}
      API_CONTINUOUS_DETECTION_ENABLED: ${API_CONTINUOUS_DETECTION_ENABLED}
      API_CONTINUOUS_DETECTION_BATCH_SIZE: ${API_CONTINUOUS_DETECTION_BATCH_SIZE}
      API_CONTINUOUS_DETECTION_MAX_PENDING_PER_CAMERA: ${API_CONTINUOUS_DETECTION_MAX_PENDING_PER_CAMERA}
      API_CONTINUOUS_DETECTION_SCHEDULER_INTERVAL_MS: ${API_CONTINUOUS_DETECTION_SCHEDULER_INTERVAL_MS}
      API_CONTINUOUS_DETECTION_HAZARD_INTERVAL_SECONDS: ${API_CONTINUOUS_DETECTION_HAZARD_INTERVAL_SECONDS}
      API_CONTINUOUS_DETECTION_RECOGNITION_INTERVAL_SECONDS: ${API_CONTINUOUS_DETECTION_RECOGNITION_INTERVAL_SECONDS:-4.0}
      API_FILE_VIDEO_SCAN_STEP_SECONDS: ${API_FILE_VIDEO_SCAN_STEP_SECONDS:-0.5}
      API_DETECTION_DUPLICATE_WINDOW_SECONDS: ${API_DETECTION_DUPLICATE_WINDOW_SECONDS}
      API_SOUND_ALERT_UNKNOWN_SCAN_THRESHOLD: ${API_SOUND_ALERT_UNKNOWN_SCAN_THRESHOLD:-3}
      API_SOUND_ALERT_UNKNOWN_COOLDOWN_SECONDS: ${API_SOUND_ALERT_UNKNOWN_COOLDOWN_SECONDS:-30}
      API_SOUND_ALERT_HAZARD_COOLDOWN_SECONDS: ${API_SOUND_ALERT_HAZARD_COOLDOWN_SECONDS:-10}
      API_RECOGNITION_BACKEND: ${API_RECOGNITION_BACKEND}
      API_RECOGNITION_ALLOW_FALLBACK: ${API_RECOGNITION_ALLOW_FALLBACK}
      API_RECOGNITION_INSIGHTFACE_MODEL: ${API_RECOGNITION_INSIGHTFACE_MODEL}
      API_RECOGNITION_INSIGHTFACE_PROVIDERS: ${API_RECOGNITION_INSIGHTFACE_PROVIDERS}
      API_RECOGNITION_INSIGHTFACE_CTX_ID: ${API_RECOGNITION_INSIGHTFACE_CTX_ID}
      API_RECOGNITION_INSIGHTFACE_DET_SIZE: ${API_RECOGNITION_INSIGHTFACE_DET_SIZE}
      API_RECOGNITION_ENROLLMENT_MIN_DET_SCORE: ${API_RECOGNITION_ENROLLMENT_MIN_DET_SCORE}
      API_RECOGNITION_ENROLLMENT_MIN_FACE_SIZE: ${API_RECOGNITION_ENROLLMENT_MIN_FACE_SIZE}
      API_RECOGNITION_ENROLLMENT_REQUIRE_SINGLE_FACE: ${API_RECOGNITION_ENROLLMENT_REQUIRE_SINGLE_FACE}
      API_RECOGNITION_RUNTIME_MAX_TEMPLATES_PER_PERSON: ${API_RECOGNITION_RUNTIME_MAX_TEMPLATES_PER_PERSON}
      API_RECOGNITION_RUNTIME_TEMPLATE_MIN_DET_SCORE: ${API_RECOGNITION_RUNTIME_TEMPLATE_MIN_DET_SCORE}
      API_RECOGNITION_RUNTIME_TEMPLATE_DUPLICATE_SIMILARITY: ${API_RECOGNITION_RUNTIME_TEMPLATE_DUPLICATE_SIMILARITY}
      VIDEO_RAG_ENABLED: ${VIDEO_RAG_ENABLED:-false}
      VIDEO_RAG_OLLAMA_URL: ${VIDEO_RAG_OLLAMA_URL:-http://host.docker.internal:11434}
      VIDEO_RAG_VISION_MODEL: ${VIDEO_RAG_VISION_MODEL:-gemma3:4b}
      VIDEO_RAG_EMBEDDING_MODEL: ${VIDEO_RAG_EMBEDDING_MODEL:-embeddinggemma}
      ENVIRONMENT: ${ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"

  rag-worker:
    build:
      context: ./apps/api
    container_name: aegispro-rag-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.video_rag"]
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aegispro:change-me@postgres:5432/aegispro}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      VIDEO_RAG_ENABLED: ${VIDEO_RAG_ENABLED:-false}
      VIDEO_RAG_OLLAMA_URL: ${VIDEO_RAG_OLLAMA_URL:-http://host.docker.internal:11434}
      VIDEO_RAG_VISION_MODEL: ${VIDEO_RAG_VISION_MODEL:-gemma3:4b}
      VIDEO_RAG_EMBEDDING_MODEL: ${VIDEO_RAG_EMBEDDING_MODEL:-embeddinggemma}
      VIDEO_RAG_EMBEDDING_DIMENSIONS: ${VIDEO_RAG_EMBEDDING_DIMENSIONS:-768}
      VIDEO_RAG_VISUAL_INDEXING_ENABLED: ${VIDEO_RAG_VISUAL_INDEXING_ENABLED:-true}
      VIDEO_RAG_REQUEST_TIMEOUT_SECONDS: ${VIDEO_RAG_REQUEST_TIMEOUT_SECONDS:-120}
      VIDEO_RAG_WORKER_INTERVAL_SECONDS: ${VIDEO_RAG_WORKER_INTERVAL_SECONDS:-15}
      VIDEO_RAG_LEASE_SECONDS: ${VIDEO_RAG_LEASE_SECONDS:-600}
      VIDEO_RAG_MAX_ATTEMPTS: ${VIDEO_RAG_MAX_ATTEMPTS:-3}
      VIDEO_RAG_MAX_FRAMES: ${VIDEO_RAG_MAX_FRAMES:-6}
      VIDEO_RAG_EVIDENCE_READ_TIMEOUT_SECONDS: ${VIDEO_RAG_EVIDENCE_READ_TIMEOUT_SECONDS:-15}
      ENVIRONMENT: ${ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./storage:/app/storage

  ai:
    build:
      context: ./apps/ai
    container_name: aegispro-ai
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      AI_MODEL_BACKEND: ${AI_MODEL_BACKEND}
      AI_MODEL_NAME: ${AI_MODEL_NAME}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION}
      AI_MODEL_FALLBACK_BACKEND: ${AI_MODEL_FALLBACK_BACKEND}
      AI_ALLOW_BACKEND_FALLBACK: ${AI_ALLOW_BACKEND_FALLBACK}
      AI_MODEL_WEIGHTS_PATH: ${AI_MODEL_WEIGHTS_PATH}
      AI_MODEL_PERSON_WEAPON_WEIGHTS_PATH: ${AI_MODEL_PERSON_WEAPON_WEIGHTS_PATH}
      AI_MODEL_WEAPON_WEIGHTS_PATH: ${AI_MODEL_WEAPON_WEIGHTS_PATH}
      AI_MODEL_WEAPON_ENSEMBLE_GENERAL: ${AI_MODEL_WEAPON_ENSEMBLE_GENERAL}
      AI_MODEL_WEAPON_EXCLUDED_LABELS: ${AI_MODEL_WEAPON_EXCLUDED_LABELS}
      AI_MODEL_WEAPON_GENERAL_FALLBACK_CONFIDENCE: ${AI_MODEL_WEAPON_GENERAL_FALLBACK_CONFIDENCE}
      AI_MODEL_GENERIC_WEAPON_MIN_CONFIDENCE: ${AI_MODEL_GENERIC_WEAPON_MIN_CONFIDENCE}
      AI_MODEL_FIRE_SMOKE_WEIGHTS_PATH: ${AI_MODEL_FIRE_SMOKE_WEIGHTS_PATH}
      AI_MODEL_FIRE_WEIGHTS_PATH: ${AI_MODEL_FIRE_WEIGHTS_PATH}
      AI_MODEL_SMOKE_WEIGHTS_PATH: ${AI_MODEL_SMOKE_WEIGHTS_PATH}
      AI_MODEL_WEAPON_PROMOTION_PATH: ${AI_MODEL_WEAPON_PROMOTION_PATH:-}
      AI_MODEL_FIRE_SMOKE_PROMOTION_PATH: ${AI_MODEL_FIRE_SMOKE_PROMOTION_PATH:-}
      AI_MODEL_FIRE_PROMOTION_PATH: ${AI_MODEL_FIRE_PROMOTION_PATH:-}
      AI_MODEL_SMOKE_PROMOTION_PATH: ${AI_MODEL_SMOKE_PROMOTION_PATH:-}
      AI_MODEL_DEVICE: ${AI_MODEL_DEVICE}
      AI_MODEL_IMAGE_SIZE: ${AI_MODEL_IMAGE_SIZE}
      AI_MODEL_HALF_PRECISION: ${AI_MODEL_HALF_PRECISION}
      AI_MODEL_BATCH_SIZE: ${AI_MODEL_BATCH_SIZE}
      AI_MODEL_IOU_THRESHOLD: ${AI_MODEL_IOU_THRESHOLD}
      AI_MODEL_MAX_DETECTIONS: ${AI_MODEL_MAX_DETECTIONS}
      AI_MODEL_MAX_THREAT_DETECTIONS_PER_TYPE: ${AI_MODEL_MAX_THREAT_DETECTIONS_PER_TYPE}
      AI_MODEL_TRACKER_CONFIG: ${AI_MODEL_TRACKER_CONFIG}
      AI_MODEL_TRACK_PERSIST: ${AI_MODEL_TRACK_PERSIST}
      AI_MODEL_PRELOAD_ON_STARTUP: ${AI_MODEL_PRELOAD_ON_STARTUP}
      AI_MODEL_RUNTIME_AUTOINSTALL: ${AI_MODEL_RUNTIME_AUTOINSTALL}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD}
      AI_PERSON_CONFIDENCE_THRESHOLD: ${AI_PERSON_CONFIDENCE_THRESHOLD}
      AI_WEAPON_CONFIDENCE_THRESHOLD: ${AI_WEAPON_CONFIDENCE_THRESHOLD}
      AI_FIRE_CONFIDENCE_THRESHOLD: ${AI_FIRE_CONFIDENCE_THRESHOLD}
      AI_SMOKE_CONFIDENCE_THRESHOLD: ${AI_SMOKE_CONFIDENCE_THRESHOLD}
      AI_SMOKE_MAX_PERSON_COVERAGE: ${AI_SMOKE_MAX_PERSON_COVERAGE}
      AI_SMOKE_PERSON_CONFLICT_MIN_CONFIDENCE: ${AI_SMOKE_PERSON_CONFLICT_MIN_CONFIDENCE}
      AI_THREAT_EDGE_STRIP_MARGIN_RATIO: ${AI_THREAT_EDGE_STRIP_MARGIN_RATIO}
      AI_THREAT_EDGE_STRIP_MAX_WIDTH_RATIO: ${AI_THREAT_EDGE_STRIP_MAX_WIDTH_RATIO}
      AI_THREAT_EDGE_STRIP_MIN_HEIGHT_RATIO: ${AI_THREAT_EDGE_STRIP_MIN_HEIGHT_RATIO}
      AI_THREAT_EDGE_STRIP_MIN_ASPECT_RATIO: ${AI_THREAT_EDGE_STRIP_MIN_ASPECT_RATIO}
      AI_TEMPORAL_CONFIRMATION_ENABLED: ${AI_TEMPORAL_CONFIRMATION_ENABLED}
      AI_TEMPORAL_CONFIRMATION_MAX_GAP_SECONDS: ${AI_TEMPORAL_CONFIRMATION_MAX_GAP_SECONDS}
      AI_WEAPON_IMMEDIATE_CONFIDENCE: ${AI_WEAPON_IMMEDIATE_CONFIDENCE}
      AI_FIRE_IMMEDIATE_CONFIDENCE: ${AI_FIRE_IMMEDIATE_CONFIDENCE}
      AI_SMOKE_IMMEDIATE_CONFIDENCE: ${AI_SMOKE_IMMEDIATE_CONFIDENCE}
      AI_RECOGNITION_IMMEDIATE_CONFIDENCE: ${AI_RECOGNITION_IMMEDIATE_CONFIDENCE}
      AI_INFERENCE_FPS: ${AI_INFERENCE_FPS}
      AI_RECOGNITION_BACKEND: ${AI_RECOGNITION_BACKEND}
      AI_RECOGNITION_ALLOW_FALLBACK: ${AI_RECOGNITION_ALLOW_FALLBACK}
      AI_RECOGNITION_MATCH_THRESHOLD: ${AI_RECOGNITION_MATCH_THRESHOLD}
      AI_RECOGNITION_MIN_MARGIN: ${AI_RECOGNITION_MIN_MARGIN}
      AI_RECOGNITION_REFRESH_SECONDS: ${AI_RECOGNITION_REFRESH_SECONDS}
      AI_RECOGNITION_CACHE_IOU_THRESHOLD: ${AI_RECOGNITION_CACHE_IOU_THRESHOLD}
      AI_RECOGNITION_TEMPLATE_TOP_K: ${AI_RECOGNITION_TEMPLATE_TOP_K}
      AI_RECOGNITION_TEMPLATE_MIN_DET_SCORE: ${AI_RECOGNITION_TEMPLATE_MIN_DET_SCORE}
      AI_RECOGNITION_TEMPLATE_DUPLICATE_SIMILARITY: ${AI_RECOGNITION_TEMPLATE_DUPLICATE_SIMILARITY}
      AI_RECOGNITION_MIN_FACE_DETECTION_SCORE: ${AI_RECOGNITION_MIN_FACE_DETECTION_SCORE}
      AI_RECOGNITION_MIN_FACE_SIZE: ${AI_RECOGNITION_MIN_FACE_SIZE}
      AI_RECOGNITION_INSIGHTFACE_MODEL: ${AI_RECOGNITION_INSIGHTFACE_MODEL}
      AI_RECOGNITION_INSIGHTFACE_PROVIDERS: ${AI_RECOGNITION_INSIGHTFACE_PROVIDERS}
      AI_RECOGNITION_INSIGHTFACE_CTX_ID: ${AI_RECOGNITION_INSIGHTFACE_CTX_ID}
      AI_RECOGNITION_INSIGHTFACE_DET_SIZE: ${AI_RECOGNITION_INSIGHTFACE_DET_SIZE}
      AI_ENABLE_EVENT_CALLBACK: ${AI_ENABLE_EVENT_CALLBACK}
      AI_API_EVENT_CALLBACK_URL: ${AI_API_EVENT_CALLBACK_URL}
      AI_API_EVENT_CALLBACK_TOKEN: ${AI_API_EVENT_CALLBACK_TOKEN}
      AI_RUNTIME_GATE_REPORT_PATH: ${AI_RUNTIME_GATE_REPORT_PATH:-/app/storage/runtime/runtime-gates.json}
    volumes:
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8100:8100"

  web:
    build:
      context: ./apps/web
    container_name: aegispro-web
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL}
      API_PROXY_TARGET: ${WEB_API_PROXY_TARGET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: aegispro-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
