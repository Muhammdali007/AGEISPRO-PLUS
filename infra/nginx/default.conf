map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker's embedded DNS keeps these upstreams current when a service container
# is recreated and receives a new IP address.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
  zone api_upstream 64k;
  server api:8000 resolve;
}

upstream web_upstream {
  zone web_upstream 64k;
  server web:3000 resolve;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 55m;

  location /backend/ {
    proxy_pass http://api_upstream/;
    proxy_connect_timeout 15s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
