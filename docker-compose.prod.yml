services:
  postgres:
    ports: !reset []
    logging: &production-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    ports: !reset []
    logging: *production-logging

  api:
    ports: !reset []
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        gunicorn app.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers ${API_WORKERS:-1}
        --bind 0.0.0.0:8000
        --access-logfile -
        --error-logfile -
        --timeout 120
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *production-logging

  rag-worker:
    logging: *production-logging

  ai:
    ports: !reset []
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *production-logging

  web:
    ports: !reset []
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *production-logging

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./infra/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *production-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *production-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *production-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - postgres-exporter
      - redis-exporter
      - blackbox-exporter
    logging: *production-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    logging: *production-logging

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/ops/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    logging: *production-logging

volumes:
  prometheus_data:
  grafana_data:
